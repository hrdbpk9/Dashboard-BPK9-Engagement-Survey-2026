<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BPK9 Engagement Survey 2026 Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2733;--mu:#667085;--bd:#e3e7ec;--pr:#0f6e8c;--good:#1e8e5a;--warn:#d98a0b;--bad:#c8372d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181d;--card:#1d242c;--tx:#e8edf2;--mu:#9aa6b2;--bd:#2c3640;--pr:#4cb8d6;--good:#4fc58a;--warn:#f0b24a;--bad:#ef6a5f}}
*{box-sizing:border-box}html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Sarabun,"Noto Sans Thai",sans-serif}
header{background:var(--pr);color:#fff;padding:22px 20px}header .hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.logo{height:52px;width:auto;background:#fff;border-radius:8px;padding:4px 8px}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a{white-space:nowrap;font-size:12px;padding:4px 10px;border-radius:14px;background:var(--bg);color:var(--tx);text-decoration:none;border:1px solid var(--bd)}
main{max-width:1080px;margin:0 auto;padding:16px}section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 2px;font-size:18px}h2 span{color:var(--pr);margin-right:6px}.sub{color:var(--mu);font-size:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.k{border:1px solid var(--bd);border-radius:10px;padding:10px}.k b{font-size:24px;display:block}.k small{color:var(--mu)}
.ins{background:var(--bg);border-left:4px solid var(--pr);border-radius:6px;padding:8px 14px;margin-top:12px}.ins li{margin:3px 0 3px 16px;font-size:14px}.ins ul{margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(110px,32%) 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:13px}.bar{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;border-radius:7px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:center}th{color:var(--mu);font-weight:600;font-size:12px}td:first-child,th:first-child{text-align:left}
.hm{border-radius:4px;font-weight:600}.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:12px;color:#fff}.stack div{display:flex;align-items:center;justify-content:center}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.up{color:var(--good)}.dn{color:var(--bad)}.note{font-size:12px;color:var(--mu);margin-top:8px}footer{text-align:center;color:var(--mu);font-size:12px;padding:10px 0 30px}
details{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:8px 0}summary{cursor:pointer;font-weight:600}
</style></head><body>

const line=()=>{const t=D.trend3,w=520,h=210,x=i=>70+i*(w-170)/(t.length-1),y=v=>h-28-(v-55)*(h-52)/45;const sr=[['Engagement Score','ENG','var(--tx)',-1],['SAY','SAY','var(--pr)',1],['STAY','STAY','var(--warn)',1],['STRIVE','STRIVE','var(--good)',1]];return `<svg viewBox="0 0 ${w} ${h}" style="width:100%"><g font-size="10" fill="var(--mu)">${[60,70,80,90,100].map(v=>`<line x1="40" x2="${w-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="4" y="${y(v)+3}">${v}</text>`).join('')}${t.map((d,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${d.y}</text>`).join('')}</g>${sr.map(([n,k,c,s])=>`<polyline fill="none" stroke="${c}" stroke-width="${k=='ENG'?3:2}" points="${t.map((d,i)=>x(i)+','+y(d[k])).join(' ')}"/>${t.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[k])}" r="${k=='ENG'?4.5:3}" fill="${c}"/><text x="${x(i)}" y="${y(d[k])+(s>0?-8:16)}" font-size="${k=='ENG'?12:10}" font-weight="${k=='ENG'?700:400}" text-anchor="middle" fill="${c}">${f2(d[k])}</text>`).join('')}<text x="${x(t.length-1)+36}" y="${y(t[t.length-1][k])+4}" font-size="10" fill="${c}">${n=='Engagement Score'?'Engagement':n}</text>`).join('')}</svg>`};
const scatter=()=>{const g=Object.keys(D.imp),w=520,h=300,x=v=>40+(v-62)*(w-60)/28,y=v=>h-30-(v-.5)*(h-50)/.35;return `<svg viewBox="0 0 ${w} ${h}" style="width:100%"><line x1="${x(78)}" x2="${x(78)}" y1="10" y2="${h-30}" stroke="var(--mu)" stroke-dasharray="4"/><line x1="40" x2="${w-20}" y1="${y(.68)}" y2="${y(.68)}" stroke="var(--mu)" stroke-dasharray="4"/><text x="${w/2}" y="${h-6}" font-size="11" text-anchor="middle" fill="var(--mu)">% เห็นด้วย (ผลคะแนน) →</text><text x="12" y="${h/2}" font-size="11" fill="var(--mu)" transform="rotate(-90 12 ${h/2})" text-anchor="middle">ความสำคัญ (r) →</text><text x="46" y="22" font-size="11" fill="var(--bad)" font-weight="700">เร่งแก้ไข</text><text x="${w-24}" y="22" font-size="11" fill="var(--good)" text-anchor="end" font-weight="700">รักษาจุดแข็ง</text>${g.map(k=>{const v=D.fav[k];return `<circle cx="${x(v)}" cy="${y(D.imp[k])}" r="7" fill="${col(v)}" opacity=".85"/><text x="${x(v)+10}" y="${y(D.imp[k])+4}" font-size="10" fill="var(--tx)">${k} (${f2(v)})</text>`}).join('')}</svg>`};
const S=[
['overall','Overall Results','ภาพรวม Engagement Score และระดับความคิดเห็น',()=>kp([[f2(D.ov)+'%','Engagement Score','var(--pr)'],[D.N,'ผู้ตอบทั้งหมด'],[f2(D.fav.STRIVE)+'%','STRIVE (สูงสุด)','var(--good)'],[f2(D.fav['HR Practice'])+'%','HR Practice (ต่ำสุด)','var(--bad)']])+`<div class="stack"><div style="width:${D.ov}%;background:var(--good)">เห็นด้วย ${f2(D.ov)}%</div><div style="width:${D.neu}%;background:var(--warn)">${f2(D.neu)}%</div><div style="width:${D.dis}%;background:var(--bad)"></div></div><div class="note">เห็นด้วย (4–5) / เป็นกลาง (3) ${f2(D.neu)}% / ไม่เห็นด้วย (1–2) ${f2(D.dis)}% · สัดส่วนคำตอบ 1→5: ${D.dist.map(f2).join('% · ')}%</div><h3>คะแนนรายปัจจัย</h3>`+bars(Object.keys(D.fav).map(k=>({name:k,ENG:D.fav[k]})).sort((a,b)=>b.ENG-a.ENG))+ins('overall')],
['yr','Year Comparison','เปรียบเทียบ 2567 (2024) · 2568 (2025) · 2569 (2026)',()=>{const dl=v=>v==null?'-':`<b class="${v>=0?'up':'dn'}">${v>0?'+':''}${f2(v)}</b>`;const hd='<tr><th>หมวด</th><th>2567 (2024)</th><th>2568 (2025)</th><th>2569 (2026)</th><th>Δ 2569 vs 2568</th><th>Δ 2568 vs 2567</th></tr>';const rw=d=>`<tr><td>${d.k}</td>${[d.y24,d.y25,d.y26].map(heat2).join('')}<td>${dl(d.d25)}</td><td>${dl(d.d24)}</td></tr>`;return `<h3>แนวโน้ม Engagement Score 2567–2569</h3>${line()}<div class="tw"><table>${hd}${rw(D.eng3)}</table></div><h3>ตามหมวด (% เห็นด้วย 4–5)</h3><div class="tw"><table>${hd}${D.yr3.map(rw).join('')}</table></div><div class="note">ค่า 2567–2568 คำนวณจากข้อมูลดิบ 47 ข้อ (688 / 448 คน) ปี 2569 จาก 28 ข้อ (999 คน) — เทียบเชิงหมวด · Co-Worker+Supervisory Support = รวมข้อของทั้งสองหมวด</div><h3>Engagement Score แยกกลุ่มบุคลากร 3 ปี</h3><div class="tw"><table><tr><th>กลุ่ม</th><th>2567</th><th>2568</th><th>2569</th><th>Δ vs 2568</th></tr>${D.dm3.map(d=>`<tr><td>${d.n} <small style="color:var(--mu)">n=${d.n26}</small></td>${[d.y24,d.y25,d.y26].map(heat2).join('')}<td>${d.y25==null?'-':dl(d.y26-d.y25)}</td></tr>`).join('')}</table></div><h3>ธีมข้อเสนอแนะ (% ของความเห็นที่กล่าวถึง)</h3><div class="tw"><table><tr><th>ธีม</th><th>2567 (n=${D.ncm['2024']})</th><th>2568 (n=${D.ncm['2025']})</th><th>2569 (n=${D.ncm['2026']})</th></tr>${D.th3.map(d=>`<tr><td>${d.t}</td><td>${f2(d['2024'])}%</td><td>${f2(d['2025'])}%</td><td>${f2(d['2026'])}%</td></tr>`).join('')}</table></div>`+ins('yr')}],
['prof','Professional Group','พยาบาลวิชาชีพ / Allied Health / Back Office',()=>seg(D.prof)+ins('prof')],
['drv','Key Drivers: SAY / STAY / STRIVE','พูดถึงในทางดี · อยู่ต่อ · ทุ่มเท',()=>`<div class="g2">${['SAY','STAY','STRIVE'].map(k=>`<div class="k"><small>${k}</small><b style="color:${col(D.fav[k])}">${f2(D.fav[k])}%</b><small>เป็นกลาง ${f2(D.dn[k])}% · ไม่เห็นด้วย ${f2(D.dd[k])}%</small>${D.items.filter(i=>i.g==k).map(i=>`<div class="note">${i.q}: ${f2(i.v)}% เห็นด้วย</div>`).join('')}</div>`).join('')}</div><h3>รายข้อคำถาม (% เห็นด้วย) — 5 ข้อต่ำสุด</h3>`+bars([...D.items].sort((a,b)=>a.v-b.v).slice(0,5).map(i=>({name:`${i.q} (${i.g})`,ENG:i.v})))+`<div class="note">ข้อความคำถามเรียงไม่ตรงกับชีต Questions จึงแสดงเป็นรหัส Q — ยืนยันการจับคู่แล้วจะใส่ข้อความได้</div>`+ins('drv')],
['gen','Gender Analysis','',()=>seg(D.gen)+ins('gen')],
['age','Age Analysis','',()=>seg(D.age)+ins('age')],
['ten','Length of Service','',()=>seg(D.ten)+ins('ten')],
['edu','Education','',()=>seg(D.edu)+ins('edu')],
['lv','Position Level','',()=>seg(D.lv)+ins('lv')],
['map','Engagement Map','ความสัมพันธ์ของปัจจัยกับความผูกพัน',()=>scatter()+ins('map')],
['sec','Section Analysis','สายงาน (n≥10)',()=>seg(D.sec)+ins('sec')],
['dep','Department Analysis','รายแผนก (n≥10) และ Key Drivers',()=>`<details open><summary>10 แผนกสูงสุด</summary>${seg(D.dep.slice(0,10))}</details><details><summary>10 แผนกต่ำสุด</summary>${seg(D.dep.slice(-10).reverse())}</details><details><summary>ทั้งหมด ${D.dep.length} แผนก</summary>${seg(D.dep)}</details>`+ins('dep')],
['foc','Strategic Focus','หน่วยงานและกลุ่มบุคลากรที่ควรเร่งพัฒนา',()=>`<div class="g2"><div><h3>10 แผนกเร่งด่วน</h3>${bars(D.low)}</div><div><h3>กลุ่มบุคลากรเสี่ยง (ต่ำกว่าเฉลี่ย ${D.ov}%)</h3>${bars(D.risk)}</div></div>`+ins('foc')],
['voice','Employee Voice',`ข้อเสนอแนะ ${D.nc} ความเห็น จากผู้ตอบ ${D.N} คน`,()=>`<div class="g2"><div><h3>ธีมที่พบ (จำนวนความเห็นที่กล่าวถึง)</h3>${bars(D.themes.map(t=>({name:t.t,ENG:t.n/D.nc*100,n:t.n})))}<div class="note">1 ความเห็นอาจอยู่ได้หลายธีม · จัดกลุ่มด้วยคำสำคัญ</div></div><div><h3>เสียงสะท้อนตัวอย่าง</h3>${P.V.map(v=>`<p><span class="pill">${v[0]}</span><br>“${v[1]}”</p>`).join('')}<div class="note">ถอดความ/ตัดย่อเพื่อความเป็นส่วนตัว</div></div></div><h3>จำนวนความเห็นแยกตามหมวด</h3>`+Object.entries(D.cats).map(([k,v])=>`<span class="pill">${k}: ${v}</span> `).join('')],
['plan','Strategic Action Plan 2027','ข้อเสนอแผนพัฒนา (เป้าหมายเป็นข้อเสนอเพื่อพิจารณา)',()=>`<div class="tw"><table><tr><th>แผนงาน</th><th>ช่วงเวลา</th><th>ผู้รับผิดชอบ</th><th style="text-align:left">กิจกรรมหลัก</th><th>เป้าหมาย</th></tr>${P.P.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td style="text-align:left">${p[3]}</td><td>${p[4]}</td></tr>`).join('')}</table></div><div class="note">เป้าหมาย Engagement Score 2570: ≥ 82%</div>`],
['rec','Management Recommendation','Top 5 ตามหมวดข้อเสนอแนะ พร้อมสรุปประเด็น',()=>Object.entries(P.R).map(([k,a],i)=>`<details ${i<2?'open':''}><summary>${k}</summary><ol>${a.map(x=>`<li><b>${x[0]}</b> — ${x[1]}</li>`).join('')}</ol></details>`).join('')+`<div class="note">หมวด Co-Worker+Supervisory มีเพียง 1 ความเห็น จึงเสริมด้วยข้อมูลคะแนนสำรวจ</div>`]];
$('nav').innerHTML=S.map((s,i)=>`<a href="#s${i+1}">${i+1}. ${s[1].split(' ')[0]}</a>`).join('');
$('m').innerHTML=S.map((s,i)=>`<section id="s${i+1}"><h2><span>${i+1}</span>${s[1]}</h2><div class="sub">${s[2]}</div>${s[3]()}</section>`).join('');
</script></body></html>

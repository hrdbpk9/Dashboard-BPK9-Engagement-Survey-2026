['yr','Year Comparison','เปรียบเทียบ 2567 (2024) · 2568 (2025) · 2569 (2026) ตามหมวด',()=>{const dl=v=>v==null?'-':`<b class="${v>=0?'up':'dn'}">${v>0?'+':''}${v.toFixed(2)}</b>`;const tb=(a,t)=>`<h3>${t}</h3><div class="tw"><table><tr><th>หมวด</th><th>2567 (2024)</th><th>2568 (2025)</th><th>2569 (2026)</th><th>Δ vs 2568</th><th>Δ 2568 vs 2567</th></tr>${a.map(d=>`<tr><td>${d.k}</td>${[d.y24,d.y25,d.y26].map(heat2).join('')}<td>${dl(d.d25)}</td><td>${dl(d.d24)}</td></tr>`).join('')}</table></div>`;return `<h3>แนวโน้ม Engagement Score 2564–2569</h3>${line()}<div class="note">วงกลมโปร่ง = ค่า 2568 จากไฟล์ตอบแบบสอบถามปี 2025 (${D.raw25}%) ส่วนเส้นทึบใช้ค่าจากชีต Sheet1 (79.56%)</div>`+tb(D.yr3.filter(d=>d.b!='sub'),'ตามหมวดข้อเสนอแนะ (% เห็นด้วย 4–5)')+tb(D.yr3.filter(d=>d.b=='sub'),'ปัจจัยย่อย')+`<div class="note">“ทั่วไป/อื่นๆ” จับคู่กับ Company Practice · ค่าปี 2567–2568 คำนวณจากข้อมูลดิบตามการจัดหมวดเดิม (ปี 2567 ตรงกับ Sheet1)</div><h3>Engagement Score แยกกลุ่มบุคลากร 3 ปี</h3><div class="tw"><table><tr><th>กลุ่ม</th><th>2567</th><th>2568</th><th>2569</th><th>Δ vs 2568</th></tr>${D.dm3.map(d=>`<tr><td>${d.n} <small style="color:var(--mu)">n=${d.n26}</small></td>${[d.y24,d.y25,d.y26].map(heat2).join('')}<td>${d.y25==null?'-':dl(d.y26-d.y25)}</td></tr>`).join('')}</table></div><h3>ธีมข้อเสนอแนะ (% ของความเห็นที่กล่าวถึง)</h3><div class="tw"><table><tr><th>ธีม</th><th>2567 (n=${D.ncm['2024']})</th><th>2568 (n=${D.ncm['2025']})</th><th>2569 (n=${D.ncm['2026']})</th></tr>${D.th3.map(d=>`<tr><td>${d.t}</td><td>${d['2024']}%</td><td>${d['2025']}%</td><td>${d['2026']}%</td></tr>`).join('')}</table></div>`+ins('yr')}],
['sec','Section Analysis','สายงาน (n≥10)',()=>seg(D.sec)+ins('sec')],
['dep','Department Analysis','รายแผนก (n≥10) และ Key Drivers',()=>`<details open><summary>10 แผนกสูงสุด</summary>${seg(D.dep.slice(0,10))}</details><details><summary>10 แผนกต่ำสุด</summary>${seg(D.dep.slice(-10).reverse())}</details><details><summary>ทั้งหมด ${D.dep.length} แผนก</summary>${seg(D.dep)}</details>`+ins('dep')],
['foc','Strategic Focus','หน่วยงานและกลุ่มบุคลากรที่ควรเร่งพัฒนา',()=>`<div class="g2"><div><h3>10 แผนกเร่งด่วน</h3>${bars(D.low)}</div><div><h3>กลุ่มบุคลากรเสี่ยง (ต่ำกว่าเฉลี่ย ${D.ov}%)</h3>${bars(D.risk)}</div></div>`+ins('foc')],
['voice','Employee Voice',`ข้อเสนอแนะ ${D.nc} ความเห็น จากผู้ตอบ ${D.N} คน`,()=>`<div class="g2"><div><h3>ธีมที่พบ (จำนวนความเห็นที่กล่าวถึง)</h3>${bars(D.themes.map(t=>({name:t.t,ENG:t.n/D.nc*100,n:t.n})))}<div class="note">1 ความเห็นอาจอยู่ได้หลายธีม · จัดกลุ่มด้วยคำสำคัญ</div></div><div><h3>เสียงสะท้อนตัวอย่าง</h3>${P.V.map(v=>`<p><span class="pill">${v[0]}</span><br>“${v[1]}”</p>`).join('')}<div class="note">ถอดความ/ตัดย่อเพื่อความเป็นส่วนตัว</div></div></div><h3>จำนวนความเห็นแยกตามหมวด</h3>`+Object.entries(D.cats).map(([k,v])=>`<span class="pill">${k}: ${v}</span> `).join('')],
['plan','Strategic Action Plan 2027','ข้อเสนอแผนพัฒนา (เป้าหมายเป็นข้อเสนอเพื่อพิจารณา)',()=>`<div class="tw"><table><tr><th>แผนงาน</th><th>ช่วงเวลา</th><th>ผู้รับผิดชอบ</th><th style="text-align:left">กิจกรรมหลัก</th><th>เป้าหมาย</th></tr>${P.P.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td style="text-align:left">${p[3]}</td><td>${p[4]}</td></tr>`).join('')}</table></div><div class="note">เป้าหมาย Engagement Score 2570: ≥ 82%</div>`],
['rec','Management Recommendation','Top 5 ตามหมวดข้อเสนอแนะ พร้อมสรุปประเด็น',()=>Object.entries(P.R).map(([k,a],i)=>`<details ${i<2?'open':''}><summary>${k}</summary><ol>${a.map(x=>`<li><b>${x[0]}</b> — ${x[1]}</li>`).join('')}</ol></details>`).join('')+`<div class="note">หมวด Co-Worker+Supervisory มีเพียง 1 ความเห็น จึงเสริมด้วยข้อมูลคะแนนสำรวจ</div>`]];
$('nav').innerHTML=S.map((s,i)=>`<a href="#s${i+1}">${i+1}. ${s[1].split(' ')[0]}</a>`).join('');
$('m').innerHTML=S.map((s,i)=>`<section id="s${i+1}"><h2><span>${i+1}</span>${s[1]}</h2><div class="sub">${s[2]}</div>${s[3]()}</section>`).join('');
</script></body></html>
